[project]
name = "backend"
version = "0.1.0"
description = "API сервиса проверки кассовой дисциплины по видео (Datathon 26)"
authors = [
    { name = "Nik", email = "byluginnikita@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "itsdangerous==2.2.0",
    "boto3==1.43.114",
    "fastapi>=0.143.3",
    "psycopg[binary]==3.3.6",
    "python-multipart>=0.0.32",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "sqlalchemy==2.1.5",
    "temporalio==1.34.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend.main:run"
backend-worker = "backend.worker:run"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
